services:
  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: teamfinder_backend
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: teamfinder
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: